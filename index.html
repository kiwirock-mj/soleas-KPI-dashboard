<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soleas KPI Dashboard (Slideshow)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
        :root {
            --bg-color: #1a1a2e;
            --card-color: #2c2c4c;
            --border-color: #3a3a5e;
            --highlight-color: #4a4a6e;
            --highlight-border: #8181b1;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0c0;
            --text-title: #ffffff;
            --sales-bar: #3b82f6;
            --students-bar: #10b981;
            --prev-marker-increase-color: #f44336;
            --prev-marker-decrease-color: #2196f3;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .scaler-wrapper { width: 100%; height: 100%; position: relative; }
        .dashboard-container { display: flex; flex-direction: column; max-width: 1800px; width: 100%; height: calc(100vh - 40px); margin: auto; }
        .fixed-header { flex-shrink: 0; }
        .content-area { flex-grow: 1; overflow: hidden; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 0 15px 15px 15px; border-bottom: 1px solid var(--border-color); }
        h1 { font-size: 2.31rem; color: var(--text-title); margin: 0; display: flex; align-items: flex-end; gap: 15px; }
        .update-tag { font-size: 1.26rem; color: var(--text-secondary); font-weight: 500; white-space: nowrap; margin-bottom: 3px; }
        #datetime { font-size: 1.26rem; color: var(--text-secondary); font-weight: 500; }
        .cumulative-summary-section { display: flex; justify-content: center; padding: 5px 0 10px 0; }
        .current-summary-section { display: flex; justify-content: center; padding: 10px 0 15px 0; gap: 25px; }
        .summary-box { background-color: var(--card-color); text-align: center; padding: 15px 30px; border-radius: 12px; border: 1px solid var(--border-color); flex: 1; }
        .cumulative-sales-box { flex: 0 1 45%; padding: 15px 30px; border: 2px solid var(--highlight-border); }
        .summary-box h3 { font-size: 1.155rem; color: var(--text-secondary); margin: 0 0 10px 0; font-weight: 500; }
        .summary-main-display { display: flex; justify-content: center; align-items: baseline; gap: 15px; margin: 0; }
        .summary-box .summary-value { font-size: 2.3rem; color: var(--text-title); font-weight: 700; margin: 0; }
        .growth-summary { display: flex; align-items: baseline; gap: 10px; font-weight: 700; margin: 0; }
        .growth-summary .growth-percent { font-size: 1.6rem; font-weight: 700; }
        .growth-summary .growth-delta { font-size: 1.3rem; font-weight: 500; color: var(--text-primary); }
        .growth-summary.increase { color: #f44336; }
        .growth-summary.decrease { color: #2196f3; }
        .growth-summary.equal { color: var(--text-secondary); }
        .ranking-section { display: flex; gap: 25px; height: 100%; transition: opacity 0.4s ease-in-out; }
        .ranking-table-wrapper { flex: 1; background-color: var(--card-color); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .ranking-table-wrapper h2 { font-size: 1.575rem; color: #f0f0f0; margin: 0 0 20px 0; text-align: left; flex-shrink: 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        th { font-weight: 700; color: var(--text-secondary); font-size: 0.945rem; }
        tbody { transition: opacity 0.4s ease-in-out; }
        .fading { opacity: 0; }
        .branch-info { display: flex; flex-direction: column; }
        .branch-name { font-size: 1.155rem; font-weight: 500; }
        .growth-rate-container { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        .growth-percentage, .growth-delta { font-size: 0.945rem; font-weight: 700; }
        .increase { color: #f44336; }
        .decrease { color: #2196f3; }
        .equal-change { color: var(--text-secondary); }
        .bar-cell { position: relative; min-width: 250px; }
        .bar-container { position: relative; height: 30px; background-color: #3a3a5e; border-radius: 5px; }
        .bar { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; transition: width 0.5s ease-in-out; }
        .bar-sales { background-color: var(--sales-bar); }
        .bar-students { background-color: var(--students-bar); }
        .prev-marker { position: absolute; top: -5px; bottom: -5px; width: 4px; border-radius: 2px; z-index: 5; transition: background-color 0.4s ease-in-out; }
        .prev-marker.increase { background-color: var(--prev-marker-increase-color); }
        .prev-marker.decrease { background-color: var(--prev-marker-decrease-color); }
        .value-label { display: flex; justify-content: space-between; margin-top: 5px; font-size: 0.84rem; color: var(--text-secondary); }
        .current-value { font-weight: 700; color: var(--text-primary); }
        .rank-1 .branch-name { font-weight: 700; font-size: 1.47rem; color: #ffd700; }
        .rank-2 .branch-name { font-weight: 700; font-size: 1.365rem; color: #c0c0c0; }
        .rank-3 .branch-name { font-weight: 700; font-size: 1.26rem; color: #cd7f32; }
        #clock-section { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; gap: 5%; opacity: 0; visibility: hidden; transform: scale(1); transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out, transform 0.5s ease-in-out; }
        #clock-section.visible { opacity: 1; visibility: visible; transform: scale(1); }
        .analog-clock { width: 350px; height: 350px; border: 10px solid var(--card-color); border-radius: 50%; position: relative; background-color: var(--bg-color); box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .analog-clock .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background-color: var(--text-primary); border-radius: 4px; }
        .analog-clock .hour-hand { width: 8px; height: 90px; }
        .analog-clock .minute-hand { width: 6px; height: 120px; }
        .analog-clock .second-hand { width: 3px; height: 140px; background-color: #f44336; }
        .analog-clock .center-dot { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 15px; height: 15px; background-color: #f44336; border-radius: 50%; z-index: 10; }
        .time-info { display: flex; flex-direction: column; justify-content: space-between; height: 250px; text-align: right; }
        #date-display { font-size: 2.5rem; font-weight: 500; color: var(--text-secondary); }
        #digital-clock-display { font-size: 6rem; font-weight: 700; color: var(--text-title); }
    </style>
</head>
<body>
    <div class="scaler-wrapper">
        <div class="dashboard-container">
            <div class="fixed-header">
                <header class="header">
                    <h1>Soleas KPI Dashboard <span class="update-tag">2026/03/05 집계 기준</span></h1>
                    <div id="datetime"></div>
                </header>

                <section class="cumulative-summary-section">
                    <div class="summary-box cumulative-sales-box">
                        <h3>26년 누적 총 매출액 (1월~2월)</h3>
                        <p class="summary-value">1,165,744,383 원</p>
                    </div>
                </section>

                <section class="current-summary-section">
                    <div class="summary-box">
                        <h3>총 매출액 (02월 기준)</h3>
                        <div class="summary-main-display" id="total-sales-summary">
                            <p class="summary-value">계산 중...</p>
                        </div>
                    </div>
                    
                    <div class="summary-box">
                        <h3>총 원생수 (02월 기준)</h3>
                        <div class="summary-main-display" id="total-students-summary">
                            <p class="summary-value">계산 중...</p>
                        </div>
                    </div>
                </section>
            </div>

            <div class="content-area">
                <section class="ranking-section">
                    <div class="ranking-table-wrapper">
                        <h2>매출 순위 (전월 대비)</h2>
                        <table id="sales-table"><thead><tr><th>순위</th><th>지점명</th><th>매출 비교</th></tr></thead><tbody></tbody></table>
                    </div>
                    <div class="ranking-table-wrapper">
                        <h2>원생 수 순위 (전월 대비)</h2>
                        <table id="students-table"><thead><tr><th>순위</th><th>지점명</th><th>원생 수 비교</th></tr></thead><tbody></tbody></table>
                    </div>
                </section>

                <section id="clock-section">
                    <div class="analog-clock">
                        <div class="hand hour-hand" id="hour-hand"></div>
                        <div class="hand minute-hand" id="minute-hand"></div>
                        <div class="hand second-hand" id="second-hand"></div>
                        <div class="center-dot"></div>
                    </div>
                    <div class="time-info">
                        <div id="date-display"></div>
                        <div id="digital-clock-display"></div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script>
        // 데이터는 이전 최종값 유지
        const salesData = [
            { name: '광주봉선점', current: 52159865, prev: 53110131 },
            { name: '부천신중동점', current: 35664998, prev: 38590682 },
            { name: '동탄역점', current: 34547900, prev: 34525900 },
            { name: '광주풍암점', current: 34523100, prev: 36510682 },
            { name: '수원광교점', current: 34482422, prev: 35168500 },
            { name: '광주수완점', current: 32662083, prev: 34500608 },
            { name: '분당판교점', current: 27482365, prev: 32912448 },
            { name: '송파잠실점', current: 27314700, prev: 28754200 },
            { name: '시흥은계점', current: 24761565, prev: 21775533 },
            { name: '부천상동점', current: 23801000, prev: 24705000 },
            { name: '수원영통점', current: 21642166, prev: 23197332 },
            { name: '노원중계점', current: 21541600, prev: 20103375 },
            { name: '천안불당점', current: 19772500, prev: 24297500 },
            { name: '광명철산점', current: 19531000, prev: 20537500 },
            { name: '안성시청점', current: 19112500, prev: 20009500 },
            { name: '안산고잔점', current: 16724532, prev: 15573632 },
            { name: '논산내동점', current: 14392032, prev: 15877032 },
            { name: '포항장성점', current: 14094040, prev: 13210040 },
            { name: '대구달서점', current: 13645000, prev: 14325000 },
            { name: '부평삼산점', current: 13006500, prev: 13085500 },
            { name: '김포시청점', current: 12581000, prev: 14152500 },
            { name: '시흥목감점', current: 11887100, prev: 12313950 },
            { name: '송파문정점', current: 11335766, prev: 11627700 },
            { name: '분당오리점', current: 11054744, prev: 11998328 },
            { name: '대전도안점', current: 10656000, prev: 0 },
            { name: '일산중산점', current: 8074166, prev: 10246166 },
            { name: '청라국제도시점', current: 7202000, prev: 10983000 }
        ].sort((a, b) => b.current - a.current).map((item, index) => ({...item, rank: index + 1}));

        const studentsData = [
            { name: '광주봉선점', current: 363, prev: 383 },
            { name: '수원광교점', current: 278, prev: 279 },
            { name: '광주수완점', current: 263, prev: 293 },
            { name: '동탄역점', current: 253, prev: 250 },
            { name: '광주풍암점', current: 230, prev: 254 },
            { name: '분당판교점', current: 225, prev: 267 },
            { name: '부천신중동점', current: 224, prev: 246 },
            { name: '송파잠실점', current: 179, prev: 192 },
            { name: '부천상동점', current: 165, prev: 180 },
            { name: '수원영통점', current: 163, prev: 177 },
            { name: '광명철산점', current: 152, prev: 157 },
            { name: '노원중계점', current: 148, prev: 138 },
            { name: '안성시청점', current: 144, prev: 152 },
            { name: '시흥은계점', current: 143, prev: 145 },
            { name: '천안불당점', current: 139, prev: 157 },
            { name: '논산내동점', current: 120, prev: 127 },
            { name: '안산고잔점', current: 111, prev: 113 },
            { name: '분당오리점', current: 95, prev: 105 },
            { name: '송파문정점', current: 95, prev: 87 },
            { name: '부평삼산점', current: 93, prev: 95 },
            { name: '포항장성점', current: 93, prev: 85 },
            { name: '김포시청점', current: 89, prev: 99 },
            { name: '대구달서점', current: 83, prev: 89 },
            { name: '시흥목감점', current: 82, prev: 86 },
            { name: '대전도안점', current: 67, prev: 0 },
            { name: '일산중산점', current: 61, prev: 76 },
            { name: '청라국제도시점', current: 59, prev: 88 }
        ].sort((a, b) => b.current - a.current).map((item, index) => ({...item, rank: index + 1}));

        function getCustomPages(data) {
            const pages = [];
            pages.push(data.slice(0, 3));
            for (let i = 3; i < data.length; i += 4) { pages.push(data.slice(i, i + 4)); }
            return pages;
        }

        const salesPages = getCustomPages(salesData);
        const studentsPages = getCustomPages(studentsData);
        let currentPageIndex = 0;

        function calculateTotalSalesSummary() {
            const totalCurrentSales = salesData.reduce((sum, item) => sum + item.current, 0);
            const totalPrevSales = salesData.reduce((sum, item) => sum + item.prev, 0);
            const salesDelta = totalCurrentSales - totalPrevSales;
            const salesGrowthRate = (totalPrevSales === 0) ? 0 : (salesDelta / totalPrevSales) * 100;
            const isIncrease = salesDelta >= 0;
            const summaryElement = document.getElementById('total-sales-summary');
            summaryElement.innerHTML = `<p class="summary-value">${totalCurrentSales.toLocaleString()} 원</p><div class="growth-summary ${isIncrease ? (salesDelta === 0 ? 'equal' : 'increase') : 'decrease'}"><span class="growth-percent">${isIncrease ? (salesDelta === 0 ? '' : '▲') : '▼'}${Math.abs(salesGrowthRate).toFixed(2)}%</span><span class="growth-delta">(${salesDelta >= 0 ? (salesDelta === 0 ? '0' : `+${salesDelta.toLocaleString()}`) : salesDelta.toLocaleString()} 원)</span></div>`;
        }

        function calculateTotalStudentsSummary() {
            const totalCurrentStudents = studentsData.reduce((sum, item) => sum + item.current, 0);
            const totalPrevStudents = studentsData.reduce((sum, item) => sum + item.prev, 0);
            const studentsDelta = totalCurrentStudents - totalPrevStudents;
            const studentsGrowthRate = (totalPrevStudents === 0) ? 0 : (studentsDelta / totalPrevStudents) * 100;
            const isIncrease = studentsDelta >= 0;
            const summaryElement = document.getElementById('total-students-summary');
            summaryElement.innerHTML = `<p class="summary-value">${totalCurrentStudents.toLocaleString()} 명</p><div class="growth-summary ${isIncrease ? (studentsDelta === 0 ? 'equal' : 'increase') : 'decrease'}"><span class="growth-percent">${isIncrease ? (studentsDelta === 0 ? '' : '▲') : '▼'}${Math.abs(studentsGrowthRate).toFixed(2)}%</span><span class="growth-delta">(${studentsDelta >= 0 ? (studentsDelta === 0 ? '0' : `+${studentsDelta.toLocaleString()}`) : studentsDelta.toLocaleString()} 명)</span></div>`;
        }

        const rankingSection = document.querySelector('.ranking-section');
        const clockSection = document.getElementById('clock-section');
        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');
        const secondHand = document.getElementById('second-hand');
        const dateDisplay = document.getElementById('date-display');
        const digitalClockDisplay = document.getElementById('digital-clock-display');
        let clockUpdateInterval;

        function populateTablePage(tableId, data, barClass) {
            if (!data) return;
            const tableBody = document.querySelector(`#${tableId} tbody`);
            const maxVal = Math.max(...(tableId === 'sales-table' ? salesData : studentsData).map(d => d.current));
            const unit = tableId === 'sales-table' ? '원' : '명';
            const medals = ['🥇', '🥈', '🥉'];

            data.forEach(item => {
                const isIncrease = item.current > item.prev;
                const isNew = item.prev === 0 && item.current > 0;
                const isSame = item.current === item.prev;
                let growthPercentageText, growthDeltaText, changeClass;
                if (isNew) { growthPercentageText = 'New'; growthDeltaText = `+${item.current.toLocaleString()} ${unit}`; changeClass = 'increase'; }
                else if (isSame) { growthPercentageText = '0.0%'; growthDeltaText = `0 ${unit}`; changeClass = 'equal-change'; }
                else {
                    const growthPercentage = ((item.current - item.prev) / item.prev) * 100;
                    const growthDelta = item.current - item.prev;
                    growthPercentageText = `${isIncrease ? '▲' : '▼'}${Math.abs(growthPercentage).toFixed(2)}%`;
                    growthDeltaText = growthDelta >= 0 ? `+${growthDelta.toLocaleString()} ${unit}` : `${growthDelta.toLocaleString()} ${unit}`;
                    changeClass = isIncrease ? 'increase' : 'decrease';
                }
                const row = document.createElement('tr');
                if (item.rank <= 3) row.classList.add(`rank-${item.rank}`);
                const medal = item.rank <= 3 ? medals[item.rank - 1] : '';
                row.innerHTML = `<td>${item.rank}</td><td><div class="branch-info"><span class="branch-name">${medal} ${item.name}</span><div class="growth-rate-container"><span class="growth-percentage ${changeClass}">${growthPercentageText}</span><span class="growth-delta ${changeClass}">(${growthDeltaText})</span></div></div></td><td class="bar-cell"><div class="bar-container"><div class="bar ${barClass}" style="width: ${(item.current / maxVal) * 100}%"></div><div class="prev-marker ${changeClass}" style="left: ${(item.prev / maxVal) * 100}%"></div></div><div class="value-label"><span>전월: ${item.prev.toLocaleString()} ${unit}</span><span class="current-value">당월: ${item.current.toLocaleString()} ${unit}</span></div></td>`;
                tableBody.appendChild(row);
            });
        }

        function updateClocks() {
            const now = new Date();
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            let hours = now.getHours();
            const ampmHours = hours % 12 || 12;
            secondHand.style.transform = `rotate(${(seconds / 60) * 360}deg)`;
            minuteHand.style.transform = `rotate(${(minutes / 60) * 360 + (seconds / 60) * 6}deg)`;
            hourHand.style.transform = `rotate(${(ampmHours / 12) * 360 + (minutes / 60) * 30}deg)`;
            dateDisplay.textContent = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
            digitalClockDisplay.textContent = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }

        function showClock() {
            rankingSection.classList.add('fading');
            setTimeout(() => {
                rankingSection.style.display = 'none';
                clockSection.classList.add('visible');
                updateClocks();
                clockUpdateInterval = setInterval(updateClocks, 1000);
                setTimeout(hideClockAndRestart, 5000);
            }, 500);
        }

        function hideClockAndRestart() {
            clearInterval(clockUpdateInterval);
            clockSection.classList.remove('visible');
            setTimeout(() => {
                rankingSection.style.display = 'flex';
                setTimeout(() => rankingSection.classList.remove('fading'), 50);
                currentPageIndex = 0;
                runSlideshow();
            }, 500);
        }

        function runSlideshow() {
            const maxPages = Math.max(salesPages.length, studentsPages.length);
            if (currentPageIndex < maxPages) {
                const salesTbody = document.querySelector('#sales-table tbody');
                const studentsTbody = document.querySelector('#students-table tbody');
                salesTbody.classList.add('fading');
                studentsTbody.classList.add('fading');
                setTimeout(() => {
                    salesTbody.innerHTML = ''; studentsTbody.innerHTML = '';
                    populateTablePage('sales-table', salesPages[currentPageIndex], 'bar-sales');
                    populateTablePage('students-table', studentsPages[currentPageIndex], 'bar-students');
                    salesTbody.classList.remove('fading'); studentsTbody.classList.remove('fading');
                    currentPageIndex++;
                    setTimeout(runSlideshow, 10000);
                }, 400);
            } else { showClock(); }
        }

        function updateDateTime() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long', hour: '2-digit', minute: '2-digit' };
            document.getElementById('datetime').textContent = now.toLocaleDateString('ko-KR', options);
        }

        window.onload = function() {
            calculateTotalSalesSummary();
            calculateTotalStudentsSummary();
            updateDateTime();
            setInterval(updateDateTime, 60000);
            runSlideshow();
        };
    </script>
</body>
</html>
