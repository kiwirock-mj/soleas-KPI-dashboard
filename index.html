<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soleas KPI Dashboard (125% Optimized)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

        :root {
            --bg-color: #1a1a2e;
            --card-color: #2c2c4c;
            --border-color: #3a3a5e;
            --highlight-color: #4a4a6e;
            --highlight-border: #8181b1;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0c0;
            --text-title: #ffffff;
            --sales-bar: #3b82f6;
            --students-bar: #10b981;
            --prev-marker-increase-color: #f44336;
            --prev-marker-decrease-color: #2196f3;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            /* 125% 확대 시 잘리지 않도록 상하 여백을 적절히 조절 */
            padding: 20px 40px; 
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden; /* 가로 스크롤 방지 */
        }

        .scaler-wrapper {
            width: 100%;
            max-width: 1700px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-bottom: 10px; 
            border-bottom: 1px solid var(--border-color); 
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.1rem; /* 폰트 소폭 축소 */
            color: var(--text-title);
            margin: 0;
            display: flex;
            align-items: flex-end;
            gap: 15px;
        }
        .update-tag {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 3px;
        }

        #datetime { font-size: 1.1rem; color: var(--text-secondary); }

        /* 섹션 간 간격 축소 */
        .cumulative-summary-section {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .current-summary-section {
            display: flex;
            justify-content: center; 
            gap: 20px;
            margin-bottom: 15px;
        }

        .summary-box {
            background-color: var(--card-color);
            text-align: center;
            padding: 15px 20px; /* 패딩 축소 */
            border-radius: 12px;
            border: 1px solid var(--border-color);
            flex: 1; 
        }

        .cumulative-sales-box {
            flex: 0 1 40%;
            border: 2px solid var(--highlight-border);
        }

        .summary-box h3 { 
            font-size: 1rem; 
            color: var(--text-secondary); 
            margin: 0 0 8px 0; 
        }

        .summary-box .summary-value {
            font-size: 2.1rem; 
            color: var(--text-title);
            font-weight: 700;
            margin: 0;
        }

        .ranking-section { 
            display: flex; 
            gap: 20px; 
            flex: 1; /* 남은 공간 모두 차지 */
        }

        .ranking-table-wrapper { 
            flex: 1; 
            background-color: var(--card-color); 
            padding: 15px 25px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
        }
        
        .ranking-table-wrapper h2 { font-size: 1.4rem; color: #f0f0f0; margin: 0 0 15px 0; }
        
        table { width: 100%; border-collapse: collapse; }
        /* 행 높이 조절하여 한 화면에 들어오게 함 */
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        
        .branch-name { font-size: 1.1rem; }
        .bar-container { height: 26px; } /* 바 높이 소폭 축소 */
        
        /* 시계 모드 확대 보정 */
        #clock-section.visible {
            transform: translate(-50%, -50%) scale(1.4); /* 125% 환경에 맞춰 스케일 재조정 */
        }
    </style>
</head>
<body>
    <div class="scaler-wrapper">
        <div class="dashboard-container">
            <header class="header">
                <h1>Soleas KPI Dashboard <span class="update-tag">2026/02/02 집계 기준</span></h1>
                <div id="datetime"></div>
            </header>

            <section class="cumulative-summary-section">
                <div class="summary-box cumulative-sales-box">
                    <h3>26년 누적 총 매출액(1월)</h3>
                    <p class="summary-value">592,091,739 원</p>
                </div>
            </section>

            <section class="current-summary-section">
                <div class="summary-box">
                    <h3>총 매출액 (01월 기준)</h3>
                    <div class="summary-main-display" id="total-sales-summary">
                        <p class="summary-value">계산 중...</p>
                    </div>
                </div>
                <div class="summary-box">
                    <h3>총 원생수 (01월 기준)</h3>
                    <div class="summary-main-display" id="total-students-summary">
                        <p class="summary-value">계산 중...</p>
                    </div>
                </div>
            </section>

            <div class="content-area">
                <section class="ranking-section">
                    <div class="ranking-table-wrapper">
                        <h2>매출 순위 (전월 대비)</h2>
                        <table id="sales-table"><thead><tr><th>순위</th><th>지점명</th><th>매출 비교</th></tr></thead><tbody></tbody></table>
                    </div>
                    <div class="ranking-table-wrapper">
                        <h2>원생 수 순위 (전월 대비)</h2>
                        <table id="students-table"><thead><tr><th>순위</th><th>지점명</th><th>원생 수 비교</th></tr></thead><tbody></tbody></table>
                    </div>
                </section>

                <section id="clock-section">
                    <div class="analog-clock">
                        <div class="hand hour-hand" id="hour-hand"></div>
                        <div class="hand minute-hand" id="minute-hand"></div>
                        <div class="hand second-hand" id="second-hand"></div>
                        <div class="center-dot"></div>
                    </div>
                    <div class="time-info">
                        <div id="date-display"></div>
                        <div id="digital-clock-display"></div>
                    </div>
                </section>
            </div>
        </div>
    </div>
    </body>
</html>
