<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soleas KPI Dashboard (26년 6월 마감 기준)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
        :root {
            --bg-color: #1a1a2e;
            --card-color: #2c2c4c;
            --border-color: #3a3a5e;
            --highlight-color: #4a4a6e;
            --highlight-border: #8181b1;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0c0;
            --text-title: #ffffff;
            --sales-bar: #3b82f6;
            --students-bar: #10b981;
            --prev-marker-increase-color: #f44336;
            --prev-marker-decrease-color: #2196f3;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .scaler-wrapper { width: 100%; height: 100%; position: relative; }
        .dashboard-container { display: flex; flex-direction: column; max-width: 1800px; width: 100%; height: calc(100vh - 40px); margin: auto; }
        .fixed-header { flex-shrink: 0; }
        .content-area { flex-grow: 1; overflow: hidden; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 0 15px 15px 15px; border-bottom: 1px solid var(--border-color); }
        h1 { font-size: 2.31rem; color: var(--text-title); margin: 0; display: flex; align-items: flex-end; gap: 15px; }
        .update-tag { font-size: 1.26rem; color: var(--text-secondary); font-weight: 500; white-space: nowrap; margin-bottom: 3px; }
        #datetime { font-size: 1.26rem; color: var(--text-secondary); font-weight: 500; }
        .cumulative-summary-section { display: flex; justify-content: center; padding: 5px 0 10px 0; }
        .current-summary-section { display: flex; justify-content: center; padding: 10px 0 15px 0; gap: 25px; }
        .summary-box { background-color: var(--card-color); text-align: center; padding: 15px 30px; border-radius: 12px; border: 1px solid var(--border-color); flex: 1; }
        .cumulative-sales-box { flex: 0 1 45%; padding: 15px 30px; border: 2px solid var(--highlight-border); }
        .summary-box h3 { font-size: 1.155rem; color: var(--text-secondary); margin: 0 0 10px 0; font-weight: 500; }
        .summary-main-display { display: flex; justify-content: center; align-items: baseline; gap: 15px; margin: 0; }
        .summary-box .summary-value { font-size: 2.3rem; color: var(--text-title); font-weight: 700; margin: 0; }
        .growth-summary { display: flex; align-items: baseline; gap: 10px; font-weight: 700; margin: 0; }
        .growth-summary.increase { color: #f44336; }
        .growth-summary.decrease { color: #2196f3; }
        .ranking-section { display: flex; gap: 25px; height: 100%; transition: opacity 0.4s ease-in-out; }
        .ranking-table-wrapper { flex: 1; background-color: var(--card-color); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .ranking-table-wrapper h2 { font-size: 1.575rem; color: #f0f0f0; margin: 0 0 20px 0; text-align: left; flex-shrink: 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        th { font-weight: 700; color: var(--text-secondary); font-size: 0.945rem; }
        tbody { transition: opacity 0.4s ease-in-out; }
        .branch-info { display: flex; flex-direction: column; }
        .branch-name { font-size: 1.155rem; font-weight: 500; }
        .increase { color: #f44336; }
        .decrease { color: #2196f3; }
        .bar-cell { position: relative; min-width: 250px; }
        .bar-container { position: relative; height: 30px; background-color: #3a3a5e; border-radius: 5px; }
        .bar { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; transition: width 0.5s ease-in-out; }
        .bar-sales { background-color: var(--sales-bar); }
        .bar-students { background-color: var(--students-bar); }
        .prev-marker { position: absolute; top: -5px; bottom: -5px; width: 4px; border-radius: 2px; z-index: 5; }
        .prev-marker.increase { background-color: var(--prev-marker-increase-color); }
        .prev-marker.decrease { background-color: var(--prev-marker-decrease-color); }
        .value-label { display: flex; justify-content: space-between; margin-top: 5px; font-size: 0.84rem; color: var(--text-secondary); }
        .current-value { font-weight: 700; color: var(--text-primary); }
        .rank-1 .branch-name,
        .rank-2 .branch-name,
        .rank-3 .branch-name { font-size: 1.6rem; font-weight: 700; }
        .rank-1 .branch-name { color: #ffd700; }
        .rank-2 .branch-name { color: #c0c0c0; }
        .rank-3 .branch-name { color: #cd7f32; }
        #clock-section { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; gap: 5%; opacity: 0; visibility: hidden; transition: opacity 0.5s; }
        #clock-section.visible { opacity: 1; visibility: visible; }
        .analog-clock { width: 350px; height: 350px; border: 10px solid var(--card-color); border-radius: 50%; position: relative; background-color: var(--bg-color); }
        .analog-clock .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background-color: var(--text-primary); border-radius: 4px; }
        .analog-clock .hand.hour-hand { width: 8px; height: 90px; }
        .analog-clock .hand.minute-hand { width: 6px; height: 120px; }
        .analog-clock .hand.second-hand { width: 3px; height: 140px; background-color: #f44336; }
        .time-info { text-align: right; }
        #digital-clock-display { font-size: 6rem; font-weight: 700; }
    </style>
</head>
<body>
    <div class="scaler-wrapper">
        <div class="dashboard-container">
            <div class="fixed-header">
                <header class="header">
                    <h1>Soleas KPI Dashboard <span class="update-tag">2026/07/13 집계 기준</span></h1>
                    <div id="datetime"></div>
                </header>
                <section class="cumulative-summary-section">
                    <div class="summary-box cumulative-sales-box">
                        <h3>26년 누적 총 매출액 (1월~6월)</h3>
                        <p class="summary-value" id="accumulated-total">3,741,194,055 원</p>
                    </div>
                </section>
                <section class="current-summary-section">
                    <div class="summary-box">
                        <h3>총 매출액 (당월 기준)</h3>
                        <div class="summary-main-display" id="total-sales-summary"></div>
                    </div>
                    <div class="summary-box">
                        <h3>총 원생수 (당월 기준)</h3>
                        <div class="summary-main-display" id="total-students-summary"></div>
                    </div>
                </section>
            </div>
            <div class="content-area">
                <section class="ranking-section">
                    <div class="ranking-table-wrapper">
                        <h2>매출 순위 (전월 대비)</h2>
                        <table id="sales-table"><thead><tr><th>순위</th><th>지점명</th><th>매출 비교</th></tr></thead><tbody></tbody></table>
                    </div>
                    <div class="ranking-table-wrapper">
                        <h2>원생 수 순위 (전월 대비)</h2>
                        <table id="students-table"><thead><tr><th>순위</th><th>지점명</th><th>원생 수 비교</th></tr></thead><tbody></tbody></table>
                    </div>
                </section>
                <section id="clock-section">
                    <div class="analog-clock">
                        <div class="hand hour-hand" id="hour-hand"></div>
                        <div class="hand minute-hand" id="minute-hand"></div>
                        <div class="hand second-hand" id="second-hand"></div>
                    </div>
                    <div class="time-info">
                        <div id="date-display" style="font-size: 2.5rem; color: var(--text-secondary);"></div>
                        <div id="digital-clock-display"></div>
                    </div>
                </section>
            </div>
        </div>
    </div>
    <script>
        const salesData = [
            { name: '시흥은계점', prev: 26512232, current: 25348732 }, { name: '부천상동점', prev: 25293500, current: 26072000 },
            { name: '안산고잔점', prev: 18677729, current: 18761400 }, { name: '일산중산점', prev: 7578000, current: 5920000 },
            { name: '시흥목감점', prev: 13845500, current: 14304400 }, { name: '분당오리점', prev: 13578998, current: 10623665 },
            { name: '논산내동점', prev: 14924249, current: 16659833 }, { name: '광주풍암점', prev: 36859600, current: 35406800 },
            { name: '수원광교점', prev: 41172230, current: 41601396 }, { name: '부평삼산점', prev: 14369000, current: 15833500 },
            { name: '수원영통점', prev: 23185488, current: 21510666 }, { name: '안성시청점', prev: 21133416, current: 23410500 },
            { name: '광주수완점', prev: 35644200, current: 37656700 }, { name: '광주봉선점', prev: 52749781, current: 54206515 },
            { name: '분당판교점', prev: 37548470, current: 42036019 }, { name: '대구달서점', prev: 18484750, current: 18482000 },
            { name: '천안불당점', prev: 22147166, current: 23193500 }, { name: '송파잠실점', prev: 29059200, current: 36888200 },
            { name: '김포시청점', prev: 16012266, current: 16436766 }, { name: '동탄역점', prev: 41378545, current: 42806566 },
            { name: '광명철산점', prev: 27842400, current: 29368150 }, { name: '포항장성점', prev: 12698783, current: 12884033 },
            { name: '노원중계점', prev: 29294650, current: 28387700 }, { name: '송파문정점', prev: 16759647, current: 19768181 },
            { name: '대전도안점', prev: 11907000, current: 12655750 }, { name: '다산신도시점', prev: 15746916, current: 18570416 },
            { name: '부천신중동점', prev: 37074997, current: 0 }
        ].sort((a, b) => b.current - a.current).map((item, index) => ({...item, rank: index + 1}));

        const studentsData = [
            { name: '시흥은계점', prev: 147, current: 152 }, { name: '부천상동점', prev: 169, current: 194 },
            { name: '안산고잔점', prev: 129, current: 142 }, { name: '일산중산점', prev: 59, current: 73 },
            { name: '시흥목감점', prev: 84, current: 94 }, { name: '분당오리점', prev: 110, current: 112 },
            { name: '논산내동점', prev: 119, current: 133 }, { name: '광주풍암점', prev: 252, current: 276 },
            { name: '수원광교점', prev: 275, current: 284 }, { name: '부평삼산점', prev: 106, current: 113 },
            { name: '수원영통점', prev: 163, current: 161 }, { name: '안성시청점', prev: 152, current: 162 },
            { name: '광주수완점', prev: 294, current: 321 }, { name: '광주봉선점', prev: 367, current: 427 },
            { name: '분당판교점', prev: 292, current: 325 }, { name: '대구달서점', prev: 116, current: 114 },
            { name: '천안불당점', prev: 153, current: 186 }, { name: '송파잠실점', prev: 203, current: 232 },
            { name: '김포시청점', prev: 116, current: 120 }, { name: '동탄역점', prev: 292, current: 313 },
            { name: '광명철산점', prev: 224, current: 245 }, { name: '포항장성점', prev: 103, current: 113 },
            { name: '노원중계점', prev: 201, current: 225 }, { name: '송파문정점', prev: 128, current: 151 },
            { name: '대전도안점', prev: 77, current: 93 }, { name: '다산신도시점', prev: 103, current: 126 },
            { name: '부천신중동점', prev: 231, current: 0 }
        ].sort((a, b) => b.current - a.current).map((item, index) => ({...item, rank: index + 1}));

        function createPages(data) {
            let pages = [data.slice(0, 3)];
            for (let i = 3; i < data.length; i += 4) {
                pages.push(data.slice(i, i + 4));
            }
            return pages;
        }

        const salesPages = createPages(salesData);
        const studentsPages = createPages(studentsData);
        let currentPageIndex = 0;

        function updateSummaries() {
            const totalCurrentSales = salesData.reduce((sum, item) => sum + item.current, 0);
            const totalPrevSales = salesData.reduce((sum, item) => sum + item.prev, 0);
            const salesDelta = totalCurrentSales - totalPrevSales;
            const salesGrowthRate = totalPrevSales !== 0 ? (salesDelta / totalPrevSales) * 100 : 0;
            const sIncrease = salesDelta >= 0;

            document.getElementById('total-sales-summary').innerHTML = `
                <p class="summary-value">${totalCurrentSales.toLocaleString()} 원</p>
                <div class="growth-summary ${sIncrease ? 'increase' : 'decrease'}">
                    <span>${sIncrease ? '▲' : '▼'}${Math.abs(salesGrowthRate).toFixed(2)}%</span>
                </div>`;

            const totalCurrentStudents = studentsData.reduce((sum, item) => sum + item.current, 0);
            const totalPrevStudents = studentsData.reduce((sum, item) => sum + item.prev, 0);
            const studentsDelta = totalCurrentStudents - totalPrevStudents;
            const studentsGrowthRate = totalPrevStudents !== 0 ? (studentsDelta / totalPrevStudents) * 100 : 0;
            const stIncrease = studentsDelta >= 0;

            document.getElementById('total-students-summary').innerHTML = `
                <p class="summary-value">${totalCurrentStudents.toLocaleString()} 명</p>
                <div class="growth-summary ${stIncrease ? 'increase' : 'decrease'}">
                    <span>${stIncrease ? '▲' : '▼'}${Math.abs(studentsGrowthRate).toFixed(2)}%</span>
                </div>`;
        }

        function populateTablePage(tableId, data, barClass) {
            const tbody = document.querySelector(`#${tableId} tbody`);
            tbody.innerHTML = '';
            const totalData = tableId === 'sales-table' ? salesData : studentsData;
            const maxVal = Math.max(...totalData.map(d => Math.max(d.current, d.prev)));
            const unit = tableId === 'sales-table' ? '원' : '명';

            data.forEach(item => {
                const growth = item.prev !== 0 ? ((item.current - item.prev) / item.prev) * 100 : 0;
                const changeClass = item.current >= item.prev ? 'increase' : 'decrease';
                const row = document.createElement('tr');
                if (item.rank <= 3) row.classList.add(`rank-${item.rank}`);
                row.innerHTML = `
                    <td>${item.rank}</td>
                    <td><div class="branch-info"><span class="branch-name">${item.name}</span><span class="${changeClass}">${item.current >= item.prev ? '▲' : '▼'}${Math.abs(growth).toFixed(1)}%</span></div></td>
                    <td class="bar-cell"><div class="bar-container"><div class="bar ${barClass}" style="width: ${maxVal > 0 ? (item.current / maxVal) * 100 : 0}%"></div><div class="prev-marker ${changeClass}" style="left: ${maxVal > 0 ? (item.prev / maxVal) * 100 : 0}%"></div></div><div class="value-label"><span>전월: ${item.prev.toLocaleString()}</span><span class="current-value">당월: ${item.current.toLocaleString()} ${unit}</span></div></td>`;
                tbody.appendChild(row);
            });
        }

        function runSlideshow() {
            const rankingSection = document.querySelector('.ranking-section');
            const clockSection = document.getElementById('clock-section');

            if (currentPageIndex < salesPages.length) {
                clockSection.classList.remove('visible');
                rankingSection.style.display = 'flex';
                populateTablePage('sales-table', salesPages[currentPageIndex], 'bar-sales');
                populateTablePage('students-table', studentsPages[currentPageIndex], 'bar-students');
                currentPageIndex++;
                setTimeout(runSlideshow, 10000);
            } else {
                rankingSection.style.display = 'none';
                clockSection.classList.add('visible');
                let clockCount = 0;
                const clockTimer = setInterval(() => {
                    const now = new Date();
                    document.getElementById('hour-hand').style.transform = `rotate(${(now.getHours() % 12) * 30 + now.getMinutes() * 0.5}deg)`;
                    document.getElementById('minute-hand').style.transform = `rotate(${now.getMinutes() * 6}deg)`;
                    document.getElementById('second-hand').style.transform = `rotate(${now.getSeconds() * 6}deg)`;
                    document.getElementById('digital-clock-display').textContent = now.toLocaleTimeString('ko-KR', {hour12:false});
                    document.getElementById('date-display').textContent = now.toLocaleDateString('ko-KR', {month:'long', day:'numeric', weekday:'short'});
                    clockCount++;
                    if (clockCount >= 10) {
                        clearInterval(clockTimer);
                        currentPageIndex = 0;
                        runSlideshow();
                    }
                }, 1000);
            }
        }

        window.onload = () => {
            updateSummaries();
            runSlideshow();
        };
    </script>
</body>
</html>
